name: build-and-release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skills
        run: make validate

      - name: Build skill archives (claude.ai / Desktop)
        run: make build

      - name: Build Cursor rules
        run: make build-cursor

      - name: Bundle Cursor rules
        run: |
          cd dist/cursor && zip -r ../swebok-cursor-rules.zip rules && cd -

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swebok-skills
          path: |
            dist/*.zip
            dist/*.skill
            dist/cursor/rules/*.mdc

      - name: Attach archives to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.skill
            dist/swebok-cursor-rules.zip
